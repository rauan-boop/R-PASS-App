<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <title>R-PASS — кабинет автопроката</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:light;
      --page:#f4f7f5;
      --surface:#fff;
      --surface-soft:#f8faf9;
      --ink:#172b27;
      --muted:#71807b;
      --line:#e5ebe8;
      --green:#187b60;
      --green-deep:#12694f;
      --green-soft:#e6f4ed;
      --red:#ca5949;
      --red-soft:#fff0ed;
      --amber:#b5812c;
      --amber-soft:#fbf3e4;
      --blue:#407c93;
      --blue-soft:#e9f3f7;
      --shadow:0 18px 46px rgba(24,48,40,.09);
      font-family:"DM Sans",sans-serif;
      color:var(--ink);
      background:var(--page);
      font-synthesis:none;
      text-rendering:optimizeLegibility;
    }
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;min-height:100vh;background:var(--page)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh}
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:248px;padding:25px 17px 18px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:11px;padding:0 9px 28px}
    .brand-mark{width:40px;height:40px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font:800 15px Manrope,sans-serif;letter-spacing:0}
    .brand-title{font:800 17px Manrope,sans-serif;letter-spacing:0}
    .brand-caption{margin-top:2px;color:var(--muted);font-size:10px}
    .nav-label{padding:8px 10px;color:#94a09b;font-size:10px;font-weight:700;text-transform:uppercase}
    .nav{display:grid;gap:4px}
    .nav-button{width:100%;height:43px;display:flex;align-items:center;gap:11px;padding:0 11px;border:0;border-radius:10px;background:transparent;color:#5f706a;text-align:left;font-size:12px;font-weight:600}
    .nav-button:hover{background:var(--surface-soft);color:var(--ink)}
    .nav-button.active{background:var(--green-soft);color:var(--green-deep)}
    .nav-icon{width:23px;height:23px;display:grid;place-items:center;border-radius:7px;background:rgba(23,123,96,.08);font-size:14px}
    .nav-count{margin-left:auto;padding:3px 7px;border-radius:20px;background:#fff;color:var(--muted);font-size:10px}
    .sidebar-bottom{margin-top:auto;padding:13px 10px 0;border-top:1px solid var(--line)}
    .demo-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px}
    .demo-dot{width:7px;height:7px;border-radius:50%;background:#39a978;box-shadow:0 0 0 4px var(--green-soft)}
    .side-user{display:flex;align-items:center;gap:9px;margin-top:16px}
    .avatar{width:32px;height:32px;flex:none;border-radius:50%;background:#d9e8df;color:var(--green-deep);display:grid;place-items:center;font-size:11px;font-weight:700}
    .side-user-name{font-size:11px;font-weight:700}
    .side-user-role{margin-top:2px;color:var(--muted);font-size:9px}
    .main{min-height:100vh;margin-left:248px}
    .topbar{position:sticky;top:0;z-index:10;height:68px;padding:0 34px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px}
    .mobile-menu{display:none}
    .breadcrumb{color:var(--muted);font-size:11px}
    .breadcrumb strong{color:var(--ink);font-weight:700}
    .global-search{position:relative;width:min(340px,38vw);margin-left:auto}
    .global-search input{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:9px;background:var(--surface-soft);outline:none;color:var(--ink);font-size:11px}
    .global-search input:focus{border-color:#a8cbbd;background:#fff}
    .search-icon{position:absolute;left:12px;top:9px;color:#84918d;font-size:13px;pointer-events:none}
    .top-date{color:var(--muted);font-size:10px;white-space:nowrap}
    .top-avatar{width:32px;height:32px;border-radius:50%;background:#d9e8df;color:var(--green-deep);display:grid;place-items:center;font-size:10px;font-weight:700}
    .content{width:min(1240px,100%);margin:0 auto;padding:28px 34px 50px}
    .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px}
    .eyebrow{margin-bottom:7px;color:var(--green);font-size:10px;font-weight:700;text-transform:uppercase}
    h1{margin:0;color:var(--ink);font:800 24px/1.2 Manrope,sans-serif;letter-spacing:0}
    .page-subtitle{margin:6px 0 0;color:var(--muted);font-size:11px}
    .primary-button,.secondary-button,.quiet-button{min-height:36px;padding:0 13px;border-radius:9px;font-size:11px;font-weight:700;transition:background .15s,transform .15s}
    .primary-button{border:1px solid var(--green);background:var(--green);color:#fff}
    .primary-button:hover{background:var(--green-deep)}
    .secondary-button{border:1px solid var(--line);background:#fff;color:var(--ink)}
    .secondary-button:hover,.quiet-button:hover{background:var(--surface-soft)}
    .quiet-button{border:1px solid transparent;background:transparent;color:var(--muted)}
    .primary-button:active,.secondary-button:active{transform:translateY(1px)}
    .stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:17px}
    .stat-card{min-height:101px;padding:15px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
    .stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .stat-label{color:var(--muted);font-size:10px;font-weight:600}
    .stat-icon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px}
    .stat-icon.green{background:var(--green-soft);color:var(--green)}
    .stat-icon.red{background:var(--red-soft);color:var(--red)}
    .stat-icon.amber{background:var(--amber-soft);color:var(--amber)}
    .stat-icon.blue{background:var(--blue-soft);color:var(--blue)}
    .stat-number{margin-top:9px;font:800 23px/1 Manrope,sans-serif;letter-spacing:0}
    .stat-note{margin-top:5px;color:var(--muted);font-size:9px}
    .overview-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.8fr);gap:14px}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .panel-header{min-height:54px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
    .panel-title{font:700 12px Manrope,sans-serif}
    .panel-action{border:0;background:none;color:var(--green);font-size:10px;font-weight:700}
    .activity-list{padding:2px 16px}
    .activity-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:61px;border-bottom:1px solid #edf1ef}
    .activity-row:last-child{border:0}
    .activity-mark{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:var(--red-soft);color:var(--red);font-size:12px;font-weight:700}
    .activity-title{font-size:10px;font-weight:700}
    .activity-sub{margin-top:3px;color:var(--muted);font-size:9px}
    .activity-date{color:var(--muted);font-size:9px;white-space:nowrap}
    .company-list{padding:4px 14px}
    .company-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ef}
    .company-item:last-child{border:0}
    .company-badge{width:32px;height:32px;border-radius:9px;background:#edf4ef;color:var(--green-deep);display:grid;place-items:center;font:700 10px Manrope,sans-serif}
    .company-name{font-size:10px;font-weight:700}
    .company-meta{margin-top:3px;color:var(--muted);font-size:9px}
    .company-count{margin-left:auto;color:var(--muted);font-size:9px;white-space:nowrap}
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .toolbar-search{position:relative;flex:1;min-width:220px;max-width:390px}
    .toolbar-search input{width:100%;height:36px;padding:0 12px 0 33px;background:#fff;border:1px solid var(--line);border-radius:9px;outline:none;font-size:11px}
    .toolbar-search input:focus{border-color:#a8cbbd}
    .toolbar-search span{position:absolute;left:11px;top:9px;color:var(--muted);font-size:13px}
    .filter-group{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#fff}
    .filter-button{height:27px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:9px;font-weight:600}
    .filter-button.active{background:var(--green-soft);color:var(--green-deep)}
    .result-count{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;text-align:left}
    th{height:38px;padding:0 13px;background:#fafcfb;border-bottom:1px solid var(--line);color:#83918c;font-size:9px;font-weight:700;white-space:nowrap}
    td{height:59px;padding:8px 13px;border-bottom:1px solid #edf1ef;color:#42534d;font-size:10px;vertical-align:middle}
    tbody tr{cursor:pointer;transition:background .12s}
    tbody tr:hover{background:#f8fbf9}
    tbody tr:last-child td{border-bottom:0}
    .client-cell{display:flex;align-items:center;gap:9px;min-width:185px}
    .client-avatar{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:#e7efe9;color:#527560;font-size:9px;font-weight:700}
    .client-name{color:var(--ink);font-size:10px;font-weight:700;white-space:nowrap}
    .client-company{margin-top:3px;color:var(--muted);font-size:9px;white-space:nowrap}
    .mono{font-variant-numeric:tabular-nums;font-size:9px;white-space:nowrap}
    .status-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:20px;font-size:9px;font-weight:700;white-space:nowrap}
    .status-pill:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
    .status-pill.active{background:var(--red-soft);color:#b94c3e}
    .status-pill.review{background:var(--amber-soft);color:#a47422}
    .status-pill.cleared{background:var(--green-soft);color:var(--green-deep)}
    .row-arrow{color:#9aa59f;font-size:16px;text-align:right}
    .empty-state{padding:44px 20px;text-align:center;color:var(--muted);font-size:11px}
    .company-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .company-card{padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px}
    .company-card-head{display:flex;align-items:center;gap:11px}
    .company-card-logo{width:39px;height:39px;border-radius:11px;background:#edf4ef;color:var(--green-deep);display:grid;place-items:center;font:800 12px Manrope,sans-serif}
    .company-card h3{margin:0;font-size:12px}
    .company-card p{margin:4px 0 0;color:var(--muted);font-size:9px}
    .company-card-stats{display:flex;gap:20px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
    .company-card-stats strong{display:block;font:700 15px Manrope,sans-serif}
    .company-card-stats span{display:block;margin-top:4px;color:var(--muted);font-size:9px}
    .user-role{color:var(--green);font-size:9px;font-weight:700}
    .overlay{position:fixed;inset:0;z-index:40;background:rgba(13,29,24,.38);opacity:0;pointer-events:none;transition:opacity .18s}
    .overlay.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;inset:0 0 0 auto;z-index:41;width:min(480px,100%);padding:0;background:#fff;box-shadow:var(--shadow);transform:translateX(103%);transition:transform .24s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
    .drawer.open{transform:translateX(0)}
    .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
    .drawer-kicker{color:var(--red);font-size:9px;font-weight:700;text-transform:uppercase}
    .drawer-title{margin-top:5px;font:800 20px/1.2 Manrope,sans-serif}
    .drawer-close{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:15px}
    .drawer-body{overflow:auto;padding:18px 22px 24px}
    .detail-person{display:flex;align-items:center;gap:13px;padding:14px;background:var(--surface-soft);border:1px solid var(--line);border-radius:11px}
    .detail-avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#dfece3;color:var(--green-deep);font-weight:700}
    .detail-person-name{font-size:13px;font-weight:800}
    .detail-person-meta{margin-top:4px;color:var(--muted);font-size:10px}
    .detail-section{margin-top:21px}
    .detail-section h3{margin:0 0 11px;font:700 11px Manrope,sans-serif}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .detail-field{min-width:0}
    .detail-label{color:var(--muted);font-size:9px}
    .detail-value{margin-top:4px;color:var(--ink);font-size:11px;font-weight:600;overflow-wrap:anywhere}
    .detail-description{padding:12px;background:#fbf8f0;border:1px solid #f1e9d8;border-radius:9px;color:#5c5140;font-size:10px;line-height:1.55}
    .file-list{display:grid;gap:8px}
    .file-item{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}
    .file-icon{width:30px;height:30px;border-radius:8px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-size:10px;font-weight:700}
    .file-name{font-size:9px;font-weight:700}
    .file-meta{margin-top:3px;color:var(--muted);font-size:8px}
    .drawer-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
    .modal-wrap{position:fixed;inset:0;z-index:50;padding:18px;display:none;place-items:center;background:rgba(13,29,24,.42)}
    .modal-wrap.open{display:grid}
    .modal{width:min(600px,100%);max-height:min(90vh,850px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
    .modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:19px 21px 15px;border-bottom:1px solid var(--line)}
    .modal-head h2{margin:0;font:800 17px Manrope,sans-serif}
    .modal-head p{margin:5px 0 0;color:var(--muted);font-size:10px}
    .modal-body{padding:18px 21px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .form-field{display:grid;gap:6px;min-width:0}
    .form-field.full{grid-column:1/-1}
    .form-field label{color:#55655f;font-size:9px;font-weight:700}
    .form-field input,.form-field select,.form-field textarea{width:100%;min-height:36px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none;font-size:10px}
    .form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:#8bb9a4;box-shadow:0 0 0 3px rgba(24,123,96,.08)}
    .form-field textarea{min-height:86px;resize:vertical}
    .upload-box{padding:12px;border:1px dashed #cbd8d1;border-radius:9px;background:#fafcfb}
    .upload-box input{min-height:auto;padding:0;border:0;background:transparent}
    .upload-note{margin-top:5px;color:var(--muted);font-size:8px}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:13px 21px 18px;border-top:1px solid var(--line)}
    .toast{position:fixed;right:22px;bottom:22px;z-index:70;max-width:min(390px,calc(100vw - 32px));padding:12px 15px;border-radius:10px;background:#203d34;color:#fff;box-shadow:var(--shadow);font-size:10px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:translateY(0)}
    .mobile-backdrop{display:none}
    @media(max-width:1050px){.content{padding-left:24px;padding-right:24px}.topbar{padding:0 24px}.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-grid{grid-template-columns:minmax(0,1.2fr) minmax(220px,.8fr)}}
    @media(max-width:760px){
      .sidebar{width:248px;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
      .sidebar.open{transform:translateX(0)}
      .mobile-backdrop.show{display:block;position:fixed;inset:0;z-index:19;background:rgba(13,29,24,.28)}
      .main{margin-left:0}.topbar{height:58px;padding:0 15px;gap:11px}.mobile-menu{display:grid;place-items:center;width:31px;height:31px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
      .top-date{display:none}.global-search{width:auto;flex:1;max-width:260px}.content{padding:22px 15px 40px}.page-head{align-items:flex-start}.page-head h1{font-size:21px}.page-subtitle{max-width:240px;line-height:1.45}.overview-grid{grid-template-columns:1fr}.company-grid{grid-template-columns:1fr}.result-count{margin-left:0}.toolbar-search{max-width:none;flex-basis:100%}.table-wrap{margin:0 -4px}th,td{padding-left:9px;padding-right:9px}.client-cell{min-width:165px}.drawer-head{padding:17px 16px 14px}.drawer-body{padding:16px}.modal-wrap{padding:10px}.modal-head,.modal-body,.modal-footer{padding-left:15px;padding-right:15px}
    }
    @media(max-width:430px){.stats-grid{gap:8px}.stat-card{min-height:92px;padding:12px}.stat-number{font-size:20px}.top-avatar{display:none}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.page-head{gap:8px}.page-head .primary-button{padding:0 10px;font-size:10px}.activity-row{grid-template-columns:28px minmax(0,1fr) auto;gap:8px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">RP</div><div><div class="brand-title">R-PASS</div><div class="brand-caption">Сеть автопрокатов</div></div></div>

      <nav class="nav" aria-label="Основная навигация">

  <script>
    const records = [
      {id:'RP-24081',surname:'Садыкова',name:'Мадина',patronymic:'Ерлановна',iin:'980412450123',phone:'+7 701 248 19 04',company:'Nomad Rent',city:'Алматы',date:'17.10.2026',amount:'185 000 ₸',status:'active',reason:'Автомобиль возвращён с повреждением переднего бампера и правого крыла. Акт осмотра подписан клиентом.',files:['Акт осмотра.pdf','Фото повреждения 1.jpg','Фото повреждения 2.jpg'],author:'Дамир Омаров'},
      {id:'RP-24080',surname:'Ибраев',name:'Нурсултан',patronymic:'Аскарович',iin:'950721350887',phone:'+7 747 389 40 22',company:'CityDrive',city:'Астана',date:'16.10.2026',amount:'72 000 ₸',status:'review',reason:'Просрочка возврата автомобиля более чем на 18 часов. Автомобиль возвращён после обращения в поддержку.',files:['Договор аренды.pdf'],author:'Айгерим Касенова'},
      {id:'RP-24079',surname:'Ким',name:'Александр',patronymic:'Владимирович',iin:'910203301761',phone:'+7 702 508 62 11',company:'Nomad Rent',city:'Алматы',date:'15.10.2026',amount:'240 000 ₸',status:'active',reason:'Клиент передал автомобиль третьему лицу без согласования с прокатной компанией.',files:['Объяснительная.pdf','Фото документа.jpg'],author:'Дамир Омаров'},
      {id:'RP-24078',surname:'Тлеубаева',name:'Аружан',patronymic:'Маратовна',iin:'000518601924',phone:'+7 775 221 15 90',company:'AutoLine',city:'Шымкент',date:'14.10.2026',amount:'0 ₸',status:'cleared',reason:'Запись проверена администрацией и снята с активного списка.',files:['Решение администрации.pdf'],author:'Айгерим Касенова'},
      {id:'RP-24077',surname:'Жумабеков',name:'Ермек',patronymic:'Бауыржанович',iin:'890115300567',phone:'+7 701 634 70 16',company:'CityDrive',city:'Астана',date:'12.10.2026',amount:'135 000 ₸',status:'active',reason:'Автомобиль возвращён с пустым баком и повреждённым салоном. Расходы подтверждены актом.',files:['Акт возврата.pdf','Фото салона.jpg'],author:'Сауле Нурланова'},
      {id:'RP-24076',surname:'Ахметова',name:'Диана',patronymic:'Сериковна',iin:'970930400853',phone:'+7 707 990 21 34',company:'AutoLine',city:'Шымкент',date:'10.10.2026',amount:'48 000 ₸',status:'review',reason:'Повторная отмена бронирования после подачи автомобиля. Проверяется историей переписки.',files:['Скриншоты переписки.pdf'],author:'Асет Турсынов'},
      {id:'RP-24075',surname:'Оспанов',name:'Бекзат',patronymic:'Канатович',iin:'920604350176',phone:'+7 777 330 08 45',company:'Nomad Rent',city:'Алматы',date:'08.10.2026',amount:'96 000 ₸',status:'active',reason:'Нарушение правил эксплуатации автомобиля. Зафиксированы следы курения в салоне.',files:['Фото салона.jpg'],author:'Дамир Омаров'}
    ];
    const companies = [
      {name:'Nomad Rent',city:'Алматы',users:8,records:142,initials:'NR',status:'Активна'},
      {name:'CityDrive',city:'Астана',users:6,records:96,initials:'CD',status:'Активна'},
      {name:'AutoLine',city:'Шымкент',users:4,records:51,initials:'AL',status:'Активна'},
      {name:'Qazaq Mobility',city:'Караганда',users:3,records:28,initials:'QM',status:'На проверке'}
    ];
    const users = [
      {name:'Айгерим Касенова',company:'Nomad Rent',role:'Администратор',email:'a.kassenova@example.kz',status:'Активен'},
      {name:'Дамир Омаров',company:'Nomad Rent',role:'Менеджер',email:'d.omarov@example.kz',status:'Активен'},
      {name:'Сауле Нурланова',company:'CityDrive',role:'Администратор',email:'s.nurlanova@example.kz',status:'Активен'},
      {name:'Асет Турсынов',company:'AutoLine',role:'Менеджер',email:'a.tursynov@example.kz',status:'Приглашён'}
    ];
    const state={view:'overview',filter:'all',query:'',selectedId:null};
    const content=document.getElementById('content');
    const drawer=document.getElementById('record-drawer');
    const overlay=document.getElementById('overlay');
    const addModal=document.getElementById('add-modal');
    let toastTimer;

    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const initials=record=>`${record.surname?.[0]||''}${record.name?.[0]||''}`.toLocaleUpperCase('ru-RU');
    const statusInfo=status=>({active:['В списке','active'],review:['На проверке','review'],cleared:['Снята','cleared']}[status]||['—','review']);
    const ruToday=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
    const ruWeekday=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
    document.getElementById('today-label').textContent=ruToday;
    document.getElementById('nav-record-count').textContent=records.filter(item=>item.status==='active').length;

    function setView(view){
      state.view=view;
      state.query='';
      document.getElementById('global-search').value='';
      document.querySelectorAll('.nav-button').forEach(button=>button.classList.toggle('active',button.dataset.view===view));
      const labels={overview:'Обзор',blacklist:'Чёрный список',companies:'Компании',users:'Пользователи'};
      document.getElementById('breadcrumb-current').textContent=labels[view]||'Обзор';
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('mobile-backdrop').classList.remove('show');
      render();
    }

    function render(){
      if(state.view==='overview') renderOverview();
      if(state.view==='blacklist') renderBlacklist();
      if(state.view==='companies') renderCompanies();
      if(state.view==='users') renderUsers();
    }

    function pageHead(kicker,title,subtitle,action=''){
      return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="page-subtitle">${subtitle}</p></div>${action}</div>`;
    }

    function renderOverview(){
      const active=records.filter(item=>item.status==='active').length;
      const review=records.filter(item=>item.status==='review').length;
      const newest=[...records].sort((a,b)=>new Date(b.date.split('.').reverse().join('-'))-new Date(a.date.split('.').reverse().join('-'))).slice(0,5);
      content.innerHTML=`
        ${pageHead(`${ruWeekday[0].toLocaleUpperCase('ru-RU')}${ruWeekday.slice(1)}`,'Добрый день, Айгерим','Вот что происходит в сети автопрокатов сегодня.')}
        <section class="stats-grid" aria-label="Сводка">
          <article class="stat-card"><div class="stat-top"><span class="stat-label">Активные записи</span><span class="stat-icon red">▤</span></div><div class="stat-number">${active}</div><div class="stat-note">клиенты в чёрном списке</div></article>
          <article class="stat-card"><div class="stat-top"><span class="stat-label">На проверке</span><span class="stat-icon amber">◷</span></div><div class="stat-number">${review}</div><div class="stat-note">ожидают решения модератора</div></article>
          <article class="stat-card"><div class="stat-top"><span class="stat-label">Компании</span><span class="stat-icon green">▦</span></div><div class="stat-number">${companies.length}</div><div class="stat-note">подключено к R-PASS</div></article>
          <article class="stat-card"><div class="stat-top"><span class="stat-label">Пользователи</span><span class="stat-icon blue">♙</span></div><div class="stat-number">${users.length}</div><div class="stat-note">администраторы и менеджеры</div></article>
        </section>
        <section class="overview-grid">
          <article class="panel"><div class="panel-header"><div class="panel-title">Последние записи</div><button class="panel-action" data-go="blacklist">Все записи →</button></div><div class="activity-list">${newest.map(record=>`<div class="activity-row" role="button" tabindex="0" data-record="${escapeHtml(record.id)}"><span class="activity-mark">!</span><div><div class="activity-title">${escapeHtml(record.surname)} ${escapeHtml(record.name)}</div><div class="activity-sub">${escapeHtml(record.company)} · ${escapeHtml(record.city)}</div></div><span class="activity-date">${escapeHtml(record.date)}</span></div>`).join('')}</div></article>
          <article class="panel"><div class="panel-header"><div class="panel-title">Компании сети</div><button class="panel-action" data-go="companies">Открыть →</button></div><div class="company-list">${companies.slice(0,4).map(company=>`<div class="company-item"><div class="company-badge">${escapeHtml(company.initials)}</div><div><div class="company-name">${escapeHtml(company.name)}</div><div class="company-meta">${escapeHtml(company.city)}</div></div><div class="company-count">${company.records} записей</div></div>`).join('')}</div></article>
        </section>`;
    }

    function renderBlacklist(){
      const filtered=records.filter(record=>{
        const matchesStatus=state.filter==='all'||record.status===state.filter;
        const text=[record.surname,record.name,record.patronymic,record.iin,record.phone,record.company,record.city].join(' ').toLocaleLowerCase('ru-RU');
        return matchesStatus&&text.includes(state.query.toLocaleLowerCase('ru-RU'));
      });
      const action='<button class="primary-button" data-add-record>＋ Добавить запись</button>';
      content.innerHTML=`
        ${pageHead('База сети','Чёрный список','Клиенты с нарушениями условий аренды.',action)}
        <div class="toolbar"><label class="toolbar-search"><span>⌕</span><input id="record-search" type="search" value="${escapeHtml(state.query)}" placeholder="ФИО, ИИН, телефон или компания"></label><div class="filter-group">${[['all','Все'],['active','Активные'],['review','На проверке'],['cleared','Снятые']].map(([key,label])=>`<button class="filter-button ${state.filter===key?'active':''}" data-filter="${key}">${label}</button>`).join('')}</div><span class="result-count">${filtered.length} из ${records.length}</span></div>
        <section class="panel"><div class="table-wrap"><table><thead><tr><th>КЛИЕНТ</th><th>ИИН</th><th>ТЕЛЕФОН</th><th>КОМПАНИЯ</th><th>ДАТА</th><th>СТАТУС</th><th></th></tr></thead><tbody>${filtered.length?filtered.map(record=>{const [label,cls]=statusInfo(record.status);return `<tr data-record="${escapeHtml(record.id)}"><td><div class="client-cell"><div class="client-avatar">${escapeHtml(initials(record))}</div><div><div class="client-name">${escapeHtml(record.surname)} ${escapeHtml(record.name)} ${escapeHtml(record.patronymic)}</div><div class="client-company">${escapeHtml(record.city)}</div></div></div></td><td class="mono">${escapeHtml(record.iin)}</td><td class="mono">${escapeHtml(record.phone)}</td><td>${escapeHtml(record.company)}</td><td class="mono">${escapeHtml(record.date)}</td><td><span class="status-pill ${cls}">${label}</span></td><td class="row-arrow">›</td></tr>`}).join(''):`<tr><td colspan="7"><div class="empty-state">По заданным условиям записей нет</div></td></tr>`}</tbody></table></div></section>`;
    }

    function renderCompanies(){
      content.innerHTML=`${pageHead('Участники сети','Компании','Прокатные компании, подключённые к базе R-PASS.','<button class="primary-button" data-add-company>＋ Добавить компанию</button>')}<div class="company-grid">${companies.map(company=>`<article class="company-card"><div class="company-card-head"><div class="company-card-logo">${escapeHtml(company.initials)}</div><div><h3>${escapeHtml(company.name)}</h3><p>${escapeHtml(company.city)} · ${escapeHtml(company.status)}</p></div></div><div class="company-card-stats"><div><strong>${company.records}</strong><span>записей</span></div><div><strong>${company.users}</strong><span>пользователей</span></div></div></article>`).join('')}</div>`;
    }

    function renderUsers(){
      content.innerHTML=`${pageHead('Доступ к платформе','Пользователи','Администраторы и менеджеры компаний.','<button class="primary-button" data-add-user>＋ Пригласить пользователя</button>')}<section class="panel"><div class="table-wrap"><table><thead><tr><th>ИМЯ</th><th>КОМПАНИЯ</th><th>РОЛЬ</th><th>EMAIL</th><th>СТАТУС</th></tr></thead><tbody>${users.map((user,index)=>`<tr data-user="${index}"><td><div class="client-cell"><div class="client-avatar">${escapeHtml(user.name.split(' ').map(part=>part[0]).slice(0,2).join(''))}</div><div><div class="client-name">${escapeHtml(user.name)}</div></div></div></td><td>${escapeHtml(user.company)}</td><td><span class="user-role">${escapeHtml(user.role)}</span></td><td>${escapeHtml(user.email)}</td><td><span class="status-pill ${user.status==='Активен'?'cleared':'review'}">${escapeHtml(user.status)}</span></td></tr>`).join('')}</tbody></table></div></section>`;
    }

    function openRecord(id){
      const record=records.find(item=>item.id===id);
      if(!record)return;
      state.selectedId=id;
      const [label,cls]=statusInfo(record.status);
      drawer.innerHTML=`<div class="drawer-head"><div><div class="drawer-kicker">Карточка нарушения · ${escapeHtml(record.id)}</div><div class="drawer-title">Информация по клиенту</div></div><button class="drawer-close" data-close-drawer aria-label="Закрыть">×</button></div><div class="drawer-body"><div class="detail-person"><div class="detail-avatar">${escapeHtml(initials(record))}</div><div><div class="detail-person-name">${escapeHtml(record.surname)} ${escapeHtml(record.name)} ${escapeHtml(record.patronymic)}</div><div class="detail-person-meta">${escapeHtml(record.company)} · ${escapeHtml(record.city)}</div></div><span class="status-pill ${cls}" style="margin-left:auto">${label}</span></div><section class="detail-section"><h3>Данные клиента</h3><div class="detail-grid"><div class="detail-field"><div class="detail-label">ИИН</div><div class="detail-value">${escapeHtml(record.iin)}</div></div><div class="detail-field"><div class="detail-label">Телефон</div><div class="detail-value">${escapeHtml(record.phone)}</div></div><div class="detail-field"><div class="detail-label">Дата записи</div><div class="detail-value">${escapeHtml(record.date)}</div></div><div class="detail-field"><div class="detail-label">Сумма ущерба</div><div class="detail-value">${escapeHtml(record.amount)}</div></div><div class="detail-field"><div class="detail-label">Добавил</div><div class="detail-value">${escapeHtml(record.author)}</div></div><div class="detail-field"><div class="detail-label">Компания</div><div class="detail-value">${escapeHtml(record.company)}</div></div></div></section><section class="detail-section"><h3>Описание нарушения</h3><div class="detail-description">${escapeHtml(record.reason)}</div></section><section class="detail-section"><h3>Материалы дела <span style="color:var(--muted);font-weight:500">(${record.files.length})</span></h3><div class="file-list">${record.files.map((file,index)=>`<div class="file-item"><div class="file-icon">${file.toLowerCase().endsWith('.pdf')?'PDF':'IMG'}</div><div><div class="file-name">${escapeHtml(file)}</div><div class="file-meta">Демо-вложение · ${(1.2+index*.7).toFixed(1)} МБ</div></div><button class="quiet-button" style="margin-left:auto" data-file="${escapeHtml(file)}">Открыть</button></div>`).join('')}</div></section><div class="drawer-footer"><button class="secondary-button" data-close-drawer>Закрыть</button><button class="primary-button" data-toast="Демо: запись отправлена на проверку">Передать на проверку</button></div></div>`;
      overlay.classList.add('open');drawer.classList.add('open');
    }

    function closeDrawer(){overlay.classList.remove('open');drawer.classList.remove('open');state.selectedId=null}
    function openAddModal(){
      addModal.innerHTML=`<form class="modal" id="record-form"><div class="modal-head"><div><h2 id="add-title">Новая запись</h2><p>Заполните данные клиента и зафиксируйте нарушение.</p></div><button class="drawer-close" type="button" data-close-modal aria-label="Закрыть">×</button></div><div class="modal-body"><div class="form-grid"><div class="form-field"><label for="form-surname">Фамилия *</label><input id="form-surname" name="surname" required placeholder="Например, Садыков"></div><div class="form-field"><label for="form-name">Имя *</label><input id="form-name" name="name" required placeholder="Имя клиента"></div><div class="form-field"><label for="form-patronymic">Отчество</label><input id="form-patronymic" name="patronymic" placeholder="Если есть"></div><div class="form-field"><label for="form-iin">ИИН *</label><input id="form-iin" name="iin" required inputmode="numeric" pattern="[0-9]{12}" minlength="12" maxlength="12" placeholder="12 цифр"></div><div class="form-field"><label for="form-phone">Телефон *</label><input id="form-phone" name="phone" required type="tel" placeholder="+7 7__ ___ __ __"></div><div class="form-field"><label for="form-company">Компания *</label><select id="form-company" name="company" required><option value="">Выберите компанию</option>${companies.map(company=>`<option>${escapeHtml(company.name)}</option>`).join('')}</select></div><div class="form-field"><label for="form-amount">Сумма ущерба</label><input id="form-amount" name="amount" inputmode="numeric" placeholder="0 ₸"></div><div class="form-field"><label for="form-city">Город</label><select id="form-city" name="city"><option>Алматы</option><option>Астана</option><option>Шымкент</option><option>Караганда</option></select></div><div class="form-field full"><label for="form-reason">Описание нарушения *</label><textarea id="form-reason" name="reason" required placeholder="Опишите ситуацию и подтверждающие обстоятельства"></textarea></div><div class="form-field full"><label for="form-files">Фото и документы</label><div class="upload-box"><input id="form-files" name="files" type="file" multiple accept="image/*,.pdf,.doc,.docx"><div class="upload-note">Тестовый режим: файлы не отправляются на сервер.</div></div></div></div></div><div class="modal-footer"><button class="secondary-button" type="button" data-close-modal>Отмена</button><button class="primary-button" type="submit">Сохранить запись</button></div></form>`;
      addModal.classList.add('open');document.getElementById('form-surname').focus();
      document.getElementById('record-form').addEventListener('submit',saveRecord);
    }

    function closeAddModal(){addModal.classList.remove('open');addModal.replaceChildren()}
    function saveRecord(event){
      event.preventDefault();
      const form=new FormData(event.currentTarget);
      const picked=[...document.getElementById('form-files').files].map(file=>file.name);
      const record={id:`RP-${String(24082+records.length).padStart(5,'0')}`,surname:form.get('surname').trim(),name:form.get('name').trim(),patronymic:form.get('patronymic').trim(),iin:form.get('iin').trim(),phone:form.get('phone').trim(),company:form.get('company'),city:form.get('city'),date:new Intl.DateTimeFormat('ru-RU').format(new Date()),amount:form.get('amount')?`${Number(String(form.get('amount')).replace(/\D/g,'' )).toLocaleString('ru-RU')} ₸`:'0 ₸',status:'review',reason:form.get('reason').trim(),files:picked.length?picked:['Материалы не приложены'],author:'Айгерим Касенова'};
      records.unshift(record);closeAddModal();setView('blacklist');toast('Запись сохранена в демо-список и отправлена на проверку.');
    }

    function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),2800)}

    document.addEventListener('click',event=>{
      const target=event.target.closest('button,[data-record],[data-user]');
      if(!target)return;
      if(target.dataset.view){setView(target.dataset.view);return}
      if(target.dataset.go){setView(target.dataset.go);return}
      if(target.dataset.record){openRecord(target.dataset.record);return}
      if(target.dataset.filter){state.filter=target.dataset.filter;renderBlacklist();return}
      if(target.hasAttribute('data-add-record')){openAddModal();return}
      if(target.hasAttribute('data-add-company')){toast('Демо: форма подключения компании будет добавлена следующим этапом.');return}
      if(target.hasAttribute('data-add-user')){toast('Демо: приглашение пользователя подготовлено.');return}
      if(target.hasAttribute('data-close-drawer')){closeDrawer();return}
      if(target.hasAttribute('data-close-modal')){closeAddModal();return}
      if(target.hasAttribute('data-profile')){toast('Демо-профиль администратора компании');return}
      if(target.dataset.file){toast(`Демо-файл «${target.dataset.file}» не загружен в хранилище.`);return}
      if(target.dataset.toast){toast(target.dataset.toast);return}
      if(target.dataset.user!==undefined){toast(`${users[Number(target.dataset.user)].name} · ${users[Number(target.dataset.user)].role}`)}
    });

    document.getElementById('global-search').addEventListener('input',event=>{
      if(state.view!=='blacklist')setView('blacklist');
      state.query=event.target.value;
      const local=document.getElementById('record-search');
      if(local){local.value=state.query;renderBlacklist();document.getElementById('record-search').focus();document.getElementById('record-search').setSelectionRange(state.query.length,state.query.length)}
    });
    content.addEventListener('input',event=>{
      if(event.target.id==='record-search'){
        const cursor=event.target.selectionStart;
        state.query=event.target.value;
        renderBlacklist();
        const input=document.getElementById('record-search');input.focus();input.setSelectionRange(cursor,cursor);
      }
    });
    document.getElementById('mobile-menu').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('mobile-backdrop').classList.toggle('show')});
    document.getElementById('mobile-backdrop').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('mobile-backdrop').classList.remove('show')});
    overlay.addEventListener('click',closeDrawer);
    addModal.addEventListener('click',event=>{if(event.target===addModal)closeAddModal()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeDrawer();closeAddModal()}});
    render();
  </script>
</body>
</html>
