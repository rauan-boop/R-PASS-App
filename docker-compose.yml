services:
  r-pass:
    build:
      context: .
      args:
        SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
        FLUTTERFLOW_ASSETS_BASE_URL: ${FLUTTERFLOW_ASSETS_BASE_URL:-}
        TELEGRAM_SUPPORT_URL: ${TELEGRAM_SUPPORT_URL:-}
        WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL:-}
        IP_ADDRESS_API_URL: ${IP_ADDRESS_API_URL:-}
    ports:
      - "${R_PASS_PORT:-8080}:8080"
    restart: unless-stopped
